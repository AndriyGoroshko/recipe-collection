<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tailwind Custom Colors Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#2e2e2e",
              background: "#deb887",
              additional: "#ff6347",
            },
            fontFamily: {
              lora: ["Lora", "serif"],
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Lora&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background text-additional font-lora p-6">
    <h1 class="text-3xl font-bold text-additional">
      Test Custom Colors & Font
    </h1>
  </body>
</html>
